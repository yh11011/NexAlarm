name: Signed beta release

on:
  push:
    tags:
      - 'v*.*.*-beta.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing beta tag to build (v1.1.0-beta.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, verify, and publish beta
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate beta tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"

      - name: Require signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$KEY_ALIAS" "$STORE_PASSWORD" "$KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "A required Android signing secret is missing." >&2
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set release version
        shell: bash
        run: |
          echo "NEXALARM_VERSION_NAME=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "NEXALARM_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Verify source before release
        run: ./gradlew lintDebug testDebugUnitTest assembleRelease --no-daemon

      - name: Decode signing keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexalarm-release.keystore"
          chmod 600 "$RUNNER_TEMP/nexalarm-release.keystore"

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed_apk="NexAlarm-${RELEASE_TAG}.apk"
          test -f "$unsigned_apk"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner_path"
          "$apksigner_path" sign \
            --ks "$RUNNER_TEMP/nexalarm-release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:STORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out "$signed_apk" \
            "$unsigned_apk"
          "$apksigner_path" verify --verbose --print-certs "$signed_apk"
          sha256sum "$signed_apk" > "${signed_apk}.sha256"

      - name: Create release notes
        shell: bash
        run: |
          set -euo pipefail
          version_name="${RELEASE_TAG#v}"
          {
            echo "## NexAlarm $version_name"
            echo
            echo "This is a signed beta for testing, not a production or Google Play release."
            echo
            echo "### Install"
            echo "1. Download the APK and matching .sha256 file."
            echo "2. Verify: \`sha256sum -c NexAlarm-${RELEASE_TAG}.apk.sha256\`."
            echo "3. Allow installation from the chosen browser/file manager, then open the APK."
            echo
            echo "### Supported Android"
            echo "Minimum Android version: Android 8.0 (API 26). Target SDK: API 35. OEM behavior may vary."
            echo
            echo "### Verification scope"
            echo "The workflow ran lint, JVM unit tests, release assembly, APK signing, signature verification, and checksum generation. Physical-device and full 14-scenario results must be added manually when available."
            echo
            echo "### Known issues"
            echo "See [ROADMAP.md](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/docs/ROADMAP.md) and the release-specific manual test notes."
          } > release-notes.md

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "NexAlarm-${RELEASE_TAG}.apk" \
            "NexAlarm-${RELEASE_TAG}.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NexAlarm ${RELEASE_TAG#v}" \
            --notes-file release-notes.md \
            --prerelease \
            --verify-tag
