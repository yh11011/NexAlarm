<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexAlarm AI Model Logo Test</title>
<style>
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin: 0; padding: 24px;
  }
  h1 { color: #4da6ff; font-size: 20px; margin-bottom: 8px; }
  p  { color: #888; font-size: 13px; margin-bottom: 24px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 400px;
  }
  .card {
    background: #16213e;
    border-radius: 12px;
    padding: 16px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: border-color 0.2s, background 0.2s;
  }
  .card:hover, .card.selected {
    background: rgba(77,166,255,0.15);
    border-color: #4da6ff;
  }
  .card img {
    width: 40px;
    height: 40px;
    object-fit: contain;
  }
  .card .name {
    font-size: 11px;
    text-align: center;
    color: #aaa;
    line-height: 1.3;
  }
  .card.selected .name { color: #4da6ff; font-weight: 600; }
  .card .error {
    font-size: 10px;
    color: #ff6b6b;
    text-align: center;
  }
  #summary {
    margin-top: 20px;
    font-size: 13px;
    color: #888;
  }
  #summary span { color: #4da6ff; }
</style>
</head>
<body>
<h1>選擇 AI 模型</h1>
<p>連接 AI 助理，讓 AI 幫你管理鬧鐘</p>
<div class="grid" id="grid"></div>
<div id="summary">載入中...</div>

<script>
const MODELS = [
  { id: 'claude',      name: 'Claude' },
  { id: 'chatgpt',     name: 'ChatGPT' },
  { id: 'gemini',      name: 'Gemini' },
  { id: 'copilot',     name: 'Copilot' },
  { id: 'grok',        name: 'Grok' },
  { id: 'cursor',      name: 'Cursor' },
  { id: 'perplexity',  name: 'Perplexity' },
  { id: 'deepseek',    name: 'DeepSeek' },
  { id: 'kimi',        name: 'Kimi' },
  { id: 'doubao',      name: '豆包' },
  { id: 'qwen',        name: '通義千問' },
  { id: 'wenxin',      name: '文心一言' },
  { id: 'chatglm',     name: '智譜清言' },
];

const grid = document.getElementById('grid');
const summary = document.getElementById('summary');
let loaded = 0, failed = 0;

MODELS.forEach(m => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = m.id;

  const img = document.createElement('img');
  // Path relative to this HTML file (scripts/) → drawable-nodpi
  img.src = `../app/src/main/res/drawable-nodpi/ai_${m.id}.png`;
  img.alt = m.name;

  const nameEl = document.createElement('div');
  nameEl.className = 'name';
  nameEl.textContent = m.name;

  img.onload = () => {
    loaded++;
    img.dataset.loaded = 'true';
    updateSummary();
  };
  img.onerror = () => {
    failed++;
    img.style.display = 'none';
    const err = document.createElement('div');
    err.className = 'error';
    err.textContent = '載入失敗';
    card.insertBefore(err, nameEl);
    updateSummary();
  };

  card.appendChild(img);
  card.appendChild(nameEl);
  card.addEventListener('click', () => {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
  });
  grid.appendChild(card);
});

function updateSummary() {
  const total = MODELS.length;
  if (loaded + failed === total) {
    summary.innerHTML = `載入完成：<span>${loaded}/${total}</span> 個 Logo 成功${failed > 0 ? `，<span style="color:#ff6b6b">${failed}</span> 個失敗` : '，全部正常 ✓'}`;
  } else {
    summary.textContent = `載入中… ${loaded + failed}/${total}`;
  }
}
</script>
</body>
</html>
